global:
  scrape_interval:      15s
  evaluation_interval:  15s

scrape_configs:
  - job_name: 'go-app'
    scrape_interval: 5s
    static_configs:
      - targets: ['devops-backend-project-golang:8080']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'devops-monitoring-project-cadvisor:8080' ]

alerting:
  alertmanagers:
    - scheme: https
      static_configs:
        - targets:
            - "devops-monitoring-project-alertmanager:9094"